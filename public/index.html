<title>설비 점유 현황</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, 'Malgun Gothic', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
  padding-bottom: 80px;
}

.header {
  background: #1e293b;
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid #334155;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 8px;
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
@media (max-width: 480px) {
  .header { flex-direction: column; align-items: stretch; }
  .header-right { flex-direction: row; align-items: center; justify-content: space-between; }
}

.header-left h1 {
  font-size: 18px;
  font-weight: 700;
}

.header .summary {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 13px;
}

.header .summary .stat {
  display: flex;
  align-items: center;
  gap: 4px;
}

.stat .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.dot.empty { background: #475569; }
.dot.free { background: #22c55e; }
.dot.occupied { background: #ef4444; }

.import-btn {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #0f172a;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 4px;
}

.import-btn:active { transform: scale(0.95); }
.import-btn:hover { border-color: #3b82f6; color: #3b82f6; }

.tabs-wrapper {
  position: relative;
  background: #1e293b;
  border-bottom: 1px solid #334155;
}
.tabs-arrow {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(90deg, #1e293b 60%, transparent);
  color: #94a3b8;
  font-size: 18px;
  cursor: pointer;
  z-index: 2;
  user-select: none;
}
.tabs-arrow:active { color: #3b82f6; }
.tabs-arrow.left { left: 0; }
.tabs-arrow.right { right: 0; background: linear-gradient(270deg, #1e293b 60%, transparent); }

.tabs {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin: 0 32px;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex-shrink: 0;
  padding: 12px 14px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}

.tab.active {
  color: #3b82f6;
  border-bottom-color: #3b82f6;
}

.tab .tab-count {
  font-size: 11px;
  font-weight: 400;
  color: #94a3b8;
  display: block;
}

.line-view { padding: 12px; }

.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(8, 1fr); }
}
@media (min-width: 1200px) {
  .grid { grid-template-columns: repeat(10, 1fr); }
}

.eq-card {
  background: #1e293b;
  border: 2px solid #334155;
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.eq-card:active { transform: scale(0.95); }

.eq-card.empty { border-color: #334155; opacity: 0.5; }
.eq-card.free { border-color: #22c55e40; }
.eq-card.free:hover { border-color: #22c55e; background: #22c55e10; }
.eq-card.occupied { border-color: #ef4444; background: #ef444415; }

.eq-card.sh-parts { border-color: #f59e0b; background: #f59e0b15; }
.eq-card.sh-nt { border-color: #3b82f6; background: #3b82f615; }
.eq-card.sh-fqc { border-color: #22c55e; background: #22c55e15; }
.eq-card.sh-checker { border-color: #475569; background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 0 0/8px 8px; }
.eq-card.sh-done { border-color: #334155; background: #0f172a; opacity: 0.7; }
.eq-card .prepack-badge {
  position: absolute; top: -5px; right: -5px;
  background: #a855f7; color: #fff; font-size: 8px; font-weight: 700;
  padding: 1px 4px; border-radius: 4px; line-height: 1.3;
}
.eq-card .ship-stage-label {
  font-size: 8px; margin-top: 2px; font-weight: 600;
}
.eq-card.sh-parts .ship-stage-label { color: #f59e0b; }
.eq-card.sh-nt .ship-stage-label { color: #3b82f6; }
.eq-card.sh-fqc .ship-stage-label { color: #22c55e; }
.eq-card.sh-checker .ship-stage-label { color: #94a3b8; }
.eq-card.sh-done .ship-stage-label { color: #64748b; }

.eq-card .eq-number { font-size: 16px; font-weight: 700; }
.eq-card .eq-name {
  font-size: 9px; color: #94a3b8; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.eq-card .eq-priority {
  position: absolute; top: 4px; right: 6px;
  font-size: 9px; font-weight: 700; color: #f97316;
}
.eq-card .eq-status { font-size: 10px; margin-top: 4px; color: #94a3b8; }
.eq-card.free .eq-status { color: #22c55e; }
.eq-card .eq-team { font-size: 12px; font-weight: 700; margin-top: 2px; color: #fbbf24; }
.eq-card .eq-time { font-size: 9px; color: #64748b; margin-top: 2px; }
.eq-card .eq-dday {
  font-size: 9px; font-weight: 700; margin-top: 2px;
  padding: 1px 4px; border-radius: 3px;
}
.eq-dday.urgent { background: #ef444430; color: #ef4444; }
.eq-dday.soon { background: #f9731630; color: #f97316; }
.eq-dday.normal { background: #3b82f620; color: #3b82f6; }
.eq-card .eq-inspect {
  display: flex; gap: 3px; margin-top: 2px; justify-content: center;
}
.eq-inspect-dot {
  width: 8px; height: 8px; border-radius: 50%; border: 1px solid #475569;
}
.eq-inspect-dot.done { background: #22c55e; border-color: #22c55e; }

.inspect-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; background: #0f172a; border-radius: 10px; margin-bottom: 8px;
}
.inspect-label { font-size: 14px; }
.inspect-check {
  width: 28px; height: 28px; border-radius: 6px; border: 2px solid #334155;
  background: #0f172a; color: transparent; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.inspect-check.done { background: #22c55e; border-color: #22c55e; color: white; }

.shipdate-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.shipdate-input {
  flex: 1; padding: 10px 12px; border-radius: 8px;
  border: 2px solid #334155; background: #0f172a; color: #e2e8f0;
  font-size: 14px; outline: none;
}
.shipdate-input:focus { border-color: #3b82f6; }
.shipdate-set {
  padding: 10px 14px; border-radius: 8px; border: none;
  background: #3b82f6; color: white; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}

/* 모달 */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }

.modal {
  background: #1e293b; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px; padding: 24px 20px 40px;
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle { width: 40px; height: 4px; background: #475569; border-radius: 2px; margin: 0 auto 20px; }
.modal h2 { font-size: 20px; margin-bottom: 4px; }
.modal .modal-subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

.modal-info {
  background: #0f172a; border-radius: 10px; padding: 12px 14px;
  margin-bottom: 16px; font-size: 13px;
}
.modal-info .info-row {
  display: flex; justify-content: space-between; padding: 4px 0;
  border-bottom: 1px solid #1e293b;
}
.modal-info .info-row:last-child { border-bottom: none; }
.modal-info .info-label { color: #64748b; }
.modal-info .info-value { color: #e2e8f0; font-weight: 600; }

.team-grid {

<div class="login-screen" id="loginScreen" style="display:none;">
  <div class="login-box">
    <h1>설비 점유 현황</h1>
    <p>로그인 후 이용할 수 있습니다</p>
    <div id="loginForm">
      <input class="login-input" id="loginId" type="text" placeholder="ID" autocomplete="off">
      <input class="login-input" id="loginPw" type="password" placeholder="비밀번호">
      <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:#94a3b8;cursor:pointer;"><input type="checkbox" id="autoLogin" style="accent-color:#3b82f6;">자동 로그인</label>

        <option value="산업품질2팀">산업품질2팀</option>
        <option value="제조혁신1&2팀">제조혁신1&2팀</option>
        <option value="엔티">엔티</option>
        <option value="생산관리">생산관리</option>
      </select>
      <button class="login-submit" onclick="doRegister()">회원가입</button>
      <div class="login-error" id="regError"></div>
      <div class="login-toggle">이미 계정이 있으신가요? <a href="#" onclick="showLogin(); return false;">로그인</a></div>

      <button class="import-btn" onclick="location.href='/vhwkd'" style="border-color:#06b6d4;color:#06b6d4;">&#128203; 출하(daily)</button>

<script src="/socket.io/socket.io.js"></script>
<script>
let authToken = localStorage.getItem('auth_token');
let currentUser = null;
let socket = null;

let allEquipment = {};
let teams = [];
let lineNames = [];
let lineConfig = {};
let currentLine = null;

async function doLogin(auto) {
  let id, pw;
  if (auto) {
    const saved = localStorage.getItem('auto_login');
    if (!saved) return false;
    try { const d = JSON.parse(saved); id = d.id; pw = d.pw; } catch(e) { return false; }
  } else {
    id = document.getElementById('loginId').value.trim();
    pw = document.getElementById('loginPw').value;
  }
  if (!id || !pw) return false;
  try {
    const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id, pw}) });
    const data = await res.json();
    if (!res.ok) {
      if (auto) { localStorage.removeItem('auto_login'); return false; }
      document.getElementById('loginError').textContent = data.error; return false;
    }
    authToken = data.token;
    currentUser = data.user;
    localStorage.setItem('auth_token', authToken);
    if (!auto && document.getElementById('autoLogin').checked) {
      localStorage.setItem('auto_login', JSON.stringify({id, pw}));
    }
    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect');
    if (redirect) { location.href = '/' + redirect; return true; }
    showMainApp();
    return true;
  } catch(e) {
    if (!auto) document.getElementById('loginError').textContent = '서버 연결 실패';
    return false;
  }
}

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('regError').textContent = '';
}

function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginError').textContent = '';
}

async function doRegister() {
  const id = document.getElementById('regId').value.trim();
  const pw = document.getElementById('regPw').value;
  const name = document.getElementById('regName').value.trim();
  const dept = document.getElementById('regDept').value;
  if (!id || !pw || !name || !dept) { document.getElementById('regError').textContent = '모든 항목을 입력해주세요'; return; }
  try {
    const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id, pw, name, dept}) });
    const data = await res.json();
    if (!res.ok) { document.getElementById('regError').textContent = data.error; return; }
    document.getElementById('loginId').value = id;
    document.getElementById('loginPw').value = pw;
    showLogin();
    doLogin();
  } catch(e) { document.getElementById('regError').textContent = '서버 연결 실패'; }
}

document.addEventListener('DOMContentLoaded', () => {
  ['loginId', 'loginPw'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  });
  ['regId', 'regPw', 'regName'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') doRegister(); });
  });
});

async function checkAuth() {
  if (!authToken) {
    if (await doLogin(true)) return;
    showLoginScreen(); return;
  }
  try {
    const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + authToken } });
    if (!res.ok) {
      if (await doLogin(true)) return;
      showLoginScreen(); return;
    }
    currentUser = await res.json();
    showMainApp();
  } catch(e) { showLoginScreen(); }
}

function showLoginScreen() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
}

function showMainApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userInfo').innerHTML = '<strong>' + currentUser.name + '</strong> (' + currentUser.dept + ') <button class="logout-btn" onclick="doLogout()">로그아웃</button>';
  connectSocket();
}

function doLogout() {
  fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken } });
  localStorage.removeItem('auth_token');
  localStorage.removeItem('auto_login');
  location.reload();
}

function connectSocket() {
  if (socket) return;
  socket = io({ auth: { token: authToken }, reconnection: true, reconnectionDelay: 3000 });

  const connStatus = document.getElementById('connStatus');
  socket.on('connect', () => {
    connStatus.textContent = '연결됨';
    connStatus.className = 'connection-status connected';
  });

  socket.on('disconnect', () => {
    connStatus.textContent = '서버 연결이 끊겼습니다. 다시 로그인해주세요.';
    connStatus.className = 'connection-status disconnected';
    localStorage.removeItem('auth_token');
    authToken = null;
    currentUser = null;
    socket = null;
    setTimeout(() => showLoginScreen(), 1500);
  });

  socket.on('init', (data) => {
    allEquipment = data.equipment;
    teams = data.teams;
    lineNames = data.lineNames || ['A','B','C','D','E'];
    lineConfig = data.lineConfig || {};
    buildTabs();
    render();
  });

  socket.on('update', (eq) => {
    allEquipment[eq.id] = eq;
    render();
  });
}

checkAuth();

function scrollTabs(dir) {
  const tabs = document.getElementById('tabs');
  tabs.scrollBy({ left: dir * 150, behavior: 'smooth' });
}

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  const shipCount = Object.values(allEquipment).filter(e => e.shipDate && e.status !== 'empty').length;
  let html = `<div class="tab ${currentLine === null ? 'active' : ''}" onclick="switchTab(null)">전체</div>`;
  html += `<div class="tab ${currentLine === '__schedule' ? 'active' : ''}" onclick="switchTab('__schedule')" style="${currentLine === '__schedule' ? '' : 'color:#f97316;'}">출하일정<span class="tab-count">${shipCount || ''}</span></div>`;
  for (const name of lineNames) {
    html += `<div class="tab ${currentLine === name ? 'active' : ''}" onclick="switchTab('${name}')">
      ${name}<span class="tab-count" id="tabCount${name}"></span>
    </div>`;
  }
  tabsEl.innerHTML = html;
}

function switchTab(line) {
  currentLine = line;
  buildTabs();
  render();
}

function render() {
  const eqs = Object.values(allEquipment);
  document.getElementById('emptyCount').textContent = eqs.filter(e => e.status === 'empty').length;
  document.getElementById('freeCount').textContent = eqs.filter(e => e.status === 'free').length;
  document.getElementById('occupiedCount').textContent = eqs.filter(e => e.status === 'occupied').length;

  for (const name of lineNames) {
    const lineEqs = eqs.filter(e => e.line === name);
    const received = lineEqs.filter(e => e.status !== 'empty').length;
    const el = document.getElementById(`tabCount${name}`);
    if (el) el.textContent = `${received}/${lineEqs.length}`;
  }

  const content = document.getElementById('content');
  if (currentLine === '__schedule') {
    content.innerHTML = renderScheduleView(eqs);
  } else if (currentLine === null) {
    content.innerHTML = renderOverview(eqs);
  } else {
    content.innerHTML = renderLine(eqs.filter(e => e.line === currentLine));
  }
}

function renderOverview(eqs) {
  let html = '<div class="overview">';
  for (const name of lineNames) {
    const lineEqs = eqs.filter(e => e.line === name).sort((a, b) => a.number - b.number);
    const received = lineEqs.filter(e => e.status !== 'empty').length;
    html += `<div class="overview-line">
      <h3>${name}라인 — 입고 ${received}/${lineEqs.length}</h3>
      <div class="overview-grid">`;
    for (const eq of lineEqs) {
      const title = eq.status === 'empty' ? '미입고' : `${eq.equipName}${eq.team ? ' · ' + eq.team : ''}`;
      const sCls = getShipClass(eq);
      html += `<div class="overview-dot ${eq.status} ${sCls}" onclick="openModal('${eq.id}')" title="${title}">${eq.number}</div>`;
    }
    html += `</div></div>`;
  }
  html += '</div>';
  return html;
}

function renderScheduleView(eqs) {
  const withShip = eqs.filter(e => e.shipDate && e.status !== 'empty');
  if (!withShip.length) {
    return '<div class="schedule-view"><div class="schedule-empty">출하 예정 일정이 없습니다.<br>📅 출하 일정 버튼으로 메일 데이터를 가져오세요.</div></div>';
  }
  withShip.sort((a, b) => a.shipDate - b.shipDate);
  const grouped = {};
  for (const eq of withShip) {
    const d = new Date(eq.shipDate);
    const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(eq);
  }
  let html = '<div class="schedule-view">';
  for (const [dateKey, items] of Object.entries(grouped)) {
    const dday = getDday(items[0].shipDate);
    const dateLabel = new Date(dateKey + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
    html += `<div class="schedule-date-group">
      <div class="schedule-date-header">
        <span>${dateLabel} (${items.length}건)</span>
        ${dday ? `<span class="dday-tag eq-dday ${dday.cls}">${dday.text}</span>` : ''}
      </div>
      <table class="schedule-table">
        <tr><th>슬롯</th><th>장비명</th><th>Lot No</th><th>출하단계</th><th>Shipment</th><th>검수</th></tr>`;
    for (const eq of items) {
      const shipLabel = getShipLabel(eq) || '-';
      const shipColors = { mail:'#f59e0b', parts:'#3b82f6', nt:'#22c55e', fqc:'#94a3b8', done:'#64748b' };
      const shipColor = shipColors[eq.shipStage] || '#94a3b8';
      const preTag = eq.prePackaging ? '<span style="background:#a855f7;color:#fff;font-size:8px;padding:0 3px;border-radius:3px;margin-left:3px;">선</span>' : '';
      const mfg = eq.mfgInspected ? '<div class="eq-inspect-dot done" title="제조팀 완료"></div>' : '<div class="eq-inspect-dot" title="제조팀 미완"></div>';
      const fqc = eq.fqcInspected ? '<div class="eq-inspect-dot done" title="FQC 완료"></div>' : '<div class="eq-inspect-dot" title="FQC 미완"></div>';
      html += `<tr onclick="goToSlot('${eq.id}')">
        <td class="slot-col">${eq.line}-${eq.number}</td>
        <td>${eq.equipName || eq.model || '-'}${preTag}</td>
        <td style="font-size:11px;color:#94a3b8;">${eq.lotNo || '-'}</td>
        <td><span style="color:${shipColor};font-size:11px;">${shipLabel}</span></td>
        <td style="font-size:10px;color:#cbd5e1;">${esc(eq.shipment) || '-'}</td>
        <td><div class="inspect-col">${mfg}${fqc}</div></td>
      </tr>`;
    }
    html += '</table></div>';
  }
  html += '</div>';
  return html;
}

function statusLabel(s) {
  if (s === 'empty') return '미입고';
  if (s === 'free' || s === 'received') return '비어있음';
  return '작업중';
}

function getShipClass(eq) {
  if (!eq.shipDate || eq.status === 'empty') return '';
  const stageMap = { mail: 'sh-parts', parts: 'sh-nt', nt: 'sh-fqc', fqc: 'sh-checker', done: 'sh-done' };
  return stageMap[eq.shipStage] || '';
}

function getShipLabel(eq) {
  if (!eq.shipDate || eq.status === 'empty') return '';
  const labels = { mail: '생산관리 예정', parts: '사전작업 예정', nt: 'FQC 예정', fqc: '출하 예정', done: '출하 완료' };
  return labels[eq.shipStage] || '';
}

function renderLine(eqs) {
  const sorted = eqs.sort((a, b) => a.number - b.number);
  let html = '<div class="line-view"><div class="grid">';
  for (const eq of sorted) {
    const timeStr = eq.since ? getElapsed(eq.since) : '';
    const dday = getDday(eq.shipDate);
    const shipCls = getShipClass(eq);
    const shipLabel = getShipLabel(eq);
    html += `<div class="eq-card ${eq.status} ${shipCls}" onclick="openModal('${eq.id}')">
      ${eq.priority ? `<div class="eq-priority">#${eq.priority}</div>` : ''}
      ${eq.prePackaging ? '<div class="prepack-badge">선</div>' : ''}
      <div class="eq-number">${eq.number}</div>
      ${eq.lotNo ? `<div class="eq-name">${eq.lotNo}</div>` : (eq.equipName ? `<div class="eq-name">${eq.equipName}</div>` : '')}
      <div class="eq-status">${statusLabel(eq.status)}</div>
      ${eq.team ? `<div class="eq-team">${eq.team}</div>` : ''}
      ${timeStr ? `<div class="eq-time">${timeStr}</div>` : ''}
      ${shipLabel ? `<div class="ship-stage-label">${shipLabel}</div>` : ''}
      ${dday ? `<div class="eq-dday ${dday.cls}">${dday.text}</div>` : ''}
      ${renderInspectDots(eq)}
    </div>`;
  }
  html += '</div></div>';
  return html;
}

function getElapsed(since) {
  const diff = Math.floor((Date.now() - since) / 1000);
  if (diff < 60) return `${diff}초`;
  const min = Math.floor(diff / 60);
  if (min < 60) return `${min}분`;
  const hr = Math.floor(min / 60);
  return `${hr}시간 ${min % 60}분`;
}

function getDday(shipDate) {
  if (!shipDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const ship = new Date(shipDate); ship.setHours(0,0,0,0);
  const diff = Math.ceil((ship - today) / (1000 * 60 * 60 * 24));
  if (diff < 0) return { text: `D+${Math.abs(diff)}`, cls: 'urgent' };
  if (diff === 0) return { text: 'D-Day', cls: 'urgent' };
  if (diff <= 2) return { text: `D-${diff}`, cls: 'soon' };
  return { text: `D-${diff}`, cls: 'normal' };
}

function renderInspectDots(eq) {
  if (eq.status === 'empty' || !eq.shipDate) return '';
  const mfg = eq.mfgInspected ? 'done' : '';
  const fqc = eq.fqcInspected ? 'done' : '';
  return `<div class="eq-inspect" title="제조:${mfg?'완료':'미완'} FQC:${fqc?'완료':'미완'}"><div class="eq-inspect-dot ${mfg}"></div><div class="eq-inspect-dot ${fqc}"></div></div>`;
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function infoRow(label, value) {
  if (!value) return '';
  return `<div class="info-row"><span class="info-label">${esc(label)}</span><span class="info-value">${esc(value)}</span></div>`;
}

let html5QrCode = null;

function toggleQrScan(eqId) {
  const btn = document.getElementById('qrScanBtn');
  const reader = document.getElementById('qr-reader');

  if (html5QrCode) {
    stopQrScan();
    return;
  }

  btn.textContent = '⏹ 스캔 중지';
  btn.style.borderColor = '#ef4444';
  btn.style.color = '#ef4444';

  html5QrCode = new Html5Qrcode('qr-reader');
  html5QrCode.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    (decodedText) => {
      const input = document.getElementById('equipNameInput');
      if (input) input.value = decodedText;
      stopQrScan();
      socket.emit('receive', { equipmentId: eqId, equipName: decodedText });
      closeModal();
    },
    () => {}
  ).catch(err => {
    reader.innerHTML = `<p style="color:#ef4444;text-align:center;padding:16px;font-size:14px;">카메라를 사용할 수 없습니다.<br>카메라 권한을 허용해주세요.</p>`;
    btn.textContent = '📷 QR 스캔으로 입고';
    btn.style.borderColor = '';
    btn.style.color = '';
    html5QrCode = null;
  });
}

function stopQrScan() {
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
    html5QrCode = null;
  }
  const btn = document.getElementById('qrScanBtn');
  if (btn) {
    btn.textContent = '📷 QR 스캔으로 입고';
    btn.style.borderColor = '';
    btn.style.color = '';
  }
  const reader = document.getElementById('qr-reader');
  if (reader) reader.innerHTML = '';
}

function closeModal() {
  stopQrScan();
  document.getElementById('modalOverlay').classList.remove('show');
}

const actionIcons = { receive: '입고', release: '출고', checkin: '체크인', checkout: '체크아웃' };
const actionColors = { receive: 'receive', release: 'release', checkin: 'checkin', checkout: 'checkout' };

function formatLogTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

function formatLogDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

function renderTimeline(logs) {
  if (!logs.length) return '<div class="timeline-empty">이력이 없습니다</div>';
  const sorted = [...logs].sort((a, b) => b.time - a.time);
  let html = '<div class="timeline">';
  let lastDate = '';
  for (const l of sorted) {
    const dateStr = formatLogDate(l.time);
    if (dateStr !== lastDate) {
      lastDate = dateStr;
      html += `<div class="timeline-date-sep">${dateStr}</div>`;
    }
    html += `<div class="timeline-item">
      <div class="timeline-dot ${actionColors[l.action] || ''}"></div>
      <div class="timeline-time">${formatLogTime(l.time)}</div>
      <div class="timeline-content">${actionIcons[l.action] || l.action} — ${l.detail || ''}</div>
      ${l.userName ? `<div class="timeline-user">${l.userName}</div>` : ''}
    </div>`;
  }
  html += '</div>';
  return html;
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = '<div class="timeline-empty">검색 중...</div>';
  try {
    const res = await fetch('/api/history/search?q=' + encodeURIComponent(q), { headers: { 'Authorization': 'Bearer ' + authToken } });
    const grouped = await res.json();
    const keys = Object.keys(grouped);
    if (!keys.length) {
      resultsEl.innerHTML = '<div class="timeline-empty">검색 결과가 없습니다</div>';
      return;
    }
    let html = '';
    for (const eqId of keys) {
      const logs = grouped[eqId];
      const eq = allEquipment[eqId];
      const slotLabel = eq ? `${eq.line}라인 ${eq.number}번` : eqId;
      const lastEquipName = logs.reduce((name, l) => l.equipName || name, '');
      html += `<div class="search-group">
        <div class="search-group-title" onclick="goToSlot('${eqId}')">
          ${slotLabel} — ${lastEquipName || ''}
          <span class="slot-link">바로가기 &#8594;</span>
        </div>
        ${renderTimeline(logs)}
      </div>`;
    }
    resultsEl.innerHTML = html;
  } catch(e) {
    resultsEl.innerHTML = '<div class="timeline-empty">검색 오류</div>';
  }
}

    <button class="cancel-btn" onclick="closeModal()">닫기</button>
  `;
  overlay.classList.add('show');
  if (activeTab === 'outlook') renderOutlookTab();
  else if (activeTab === 'paste') renderPasteTab();
  else if (activeTab === 'settings') renderSettingsTab();
}

async function renderOutlookTab() {
  const el = document.getElementById('shipTabContent');
  el.innerHTML = '<div class="timeline-empty">상태 확인 중...</div>';
  try {
    const res = await fetch('/api/graph/status', { headers: { 'Authorization': 'Bearer ' + authToken } });
    const status = await res.json();
    if (status.connected) {
      const lastStr = status.lastChecked ? new Date(status.lastChecked).toLocaleString('ko-KR') : '없음';
      el.innerHTML = `
        <div style="padding:12px 14px;background:#22c55e15;border:1px solid #22c55e40;border-radius:10px;margin-bottom:12px;">
          <span style="color:#22c55e;font-weight:700;">● Microsoft 연결됨</span>
          <span style="color:#94a3b8;font-size:12px;margin-left:8px;">마지막 확인: ${lastStr}</span>
        </div>
        <button class="receive-btn" style="background:#3b82f6;" onclick="checkOutlookEmails()">지금 메일 확인</button>
        <button class="receive-btn" style="background:#ef4444;margin-top:8px;" onclick="disconnectOutlook()">연결 해제</button>
        <div id="outlookResult" style="margin-top:12px;"></div>
        <p style="color:#64748b;font-size:11px;margin-top:12px;">* 5분마다 자동으로 새 메일을 확인합니다</p>
      `;
    } else {
      el.innerHTML = `
        <div style="padding:12px 14px;background:#ef444415;border:1px solid #ef444440;border-radius:10px;margin-bottom:12px;">
          <span style="color:#ef4444;font-weight:700;">● 미연결</span>
          <span style="color:#94a3b8;font-size:12px;margin-left:8px;">${status.reason}</span>
        </div>
        ${status.reason === '설정 필요'
          ? '<p style="color:#94a3b8;font-size:13px;">먼저 <b>설정</b> 탭에서 앱 정보를 입력해주세요.</p>'
          : '<button class="receive-btn" style="background:#3b82f6;" onclick="loginMicrosoft()">Microsoft 로그인</button>'}
        <div id="outlookResult" style="margin-top:12px;"></div>
      `;
    }
  } catch(e) {
    el.innerHTML = '<div class="import-result error">상태 확인 실패: ' + e.message + '</div>';
  }
}

async function loginMicrosoft() {
  try {
    const res = await fetch('/api/graph/login', { headers: { 'Authorization': 'Bearer ' + authToken } });
    const data = await res.json();
    if (!res.ok) { alert(data.error); return; }
    window.open(data.url, 'msLogin', 'width=600,height=700');
    document.getElementById('outlookResult').innerHTML = '<div class="import-result success">로그인 창이 열렸습니다. 로그인 완료 후 이 창으로 돌아오세요.</div>';
  } catch(e) { alert('오류: ' + e.message); }
}

async function disconnectOutlook() {
  if (!confirm('Outlook 연결을 해제하시겠습니까?')) return;
  try {
    await fetch('/api/graph/disconnect', { method:'POST', headers:{'Authorization':'Bearer '+authToken} });
    renderOutlookTab();
  } catch(e) { alert('오류: ' + e.message); }
}

async function checkOutlookEmails() {
  const el = document.getElementById('outlookResult');
  el.innerHTML = '<div class="timeline-empty">메일 확인 중...</div>';
  try {
    const res = await fetch('/api/graph/check-emails', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + authToken },
    });
    const data = await res.json();
    if (!res.ok) { el.innerHTML = '<div class="import-result error">' + data.error + '</div>'; return; }
    let html = '';
    if (data.subject) {
      html += '<div style="background:#1e293b;padding:8px 12px;border-radius:8px;margin-bottom:8px;font-size:12px;">';
      html += '<div style="color:#e2e8f0;font-weight:600;">📧 ' + data.subject + '</div>';
      html += '<div style="color:#94a3b8;margin-top:4px;">보낸사람: ' + (data.from||'') + ' | ' + new Date(data.receivedAt).toLocaleString('ko-KR') + '</div>';
      if (data.debugHtmlLength !== undefined) {
        html += '<div style="color:#f59e0b;margin-top:4px;">HTML 본문 길이: ' + data.debugHtmlLength + '자 — 표(&lt;table&gt;)가 없는 메일일 수 있습니다</div>';
      }
      html += '</div>';
    }
    html += '<div class="import-result ' + (data.matched?.length > 0 ? 'success' : 'error') + '" style="margin-bottom:8px;">' + (data.message || '완료') + '</div>';
    if (data.matched?.length > 0) {
      html += '<div style="max-height:150px;overflow-y:auto;font-size:12px;">';
      for (const m of data.matched) {
        html += '<div style="padding:3px 0;border-bottom:1px solid #1e293b;">' + m.slot + ' — ' + (m.equipName||'') + ' → ' + m.shipDate + '</div>';
      }
      html += '</div>';
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="import-result error">오류: ' + e.message + '</div>';
  }
}

function renderPasteTab() {
  const el = document.getElementById('shipTabContent');
  el.innerHTML = `
    <p class="modal-subtitle" style="margin-bottom:12px;">출하검사 계획 메일의 상세 표를 복사하여 붙여넣기 하세요</p>
    <textarea class="import-textarea" id="shipScheduleText" style="height:140px;" placeholder="메일의 상세 표를 선택 → 복사(Ctrl+C) → 여기에 붙여넣기(Ctrl+V)"></textarea>
    <button class="receive-btn" style="background:#f97316;" onclick="submitShipSchedule()">일정 적용</button>
    <div id="shipScheduleResult"></div>
  `;
  setTimeout(() => document.getElementById('shipScheduleText')?.focus(), 100);
}

async function renderSettingsTab() {
  const el = document.getElementById('shipTabContent');
  el.innerHTML = '<div class="timeline-empty">설정 로드 중...</div>';
  try {
    const res = await fetch('/api/graph/config', { headers: { 'Authorization': 'Bearer ' + authToken } });
    const config = await res.json();
    el.innerHTML = `
      <p style="color:#94a3b8;font-size:12px;margin-bottom:12px;">Microsoft Entra 앱 등록 정보를 입력하세요. <a href="https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade" target="_blank" style="color:#3b82f6;">앱 등록 바로가기</a></p>
      <input class="equip-input" id="graphClientId" placeholder="Client ID (애플리케이션 ID)" value="${config.clientId || ''}" style="font-size:13px;">
      <input class="equip-input" id="graphTenantId" placeholder="Tenant ID (디렉터리 ID)" value="${config.tenantId || ''}" style="font-size:13px;">
      <input class="equip-input" id="graphClientSecret" type="password" placeholder="Client Secret (클라이언트 암호)" value="${config.clientSecret === '••••••' ? '' : ''}" style="font-size:13px;">
      ${config.clientSecret === '••••••' ? '<p style="color:#64748b;font-size:11px;margin:-4px 0 8px;">* 이미 설정됨. 변경 시에만 다시 입력하세요.</p>' : ''}
      <button class="receive-btn" style="background:#3b82f6;" onclick="saveGraphConfig()">설정 저장</button>
      <div id="settingsResult"></div>
      <div style="margin-top:16px;padding:12px;background:#0f172a;border-radius:8px;font-size:11px;color:#64748b;">
        <b style="color:#94a3b8;">앱 등록 가이드:</b><br>
        1. entra.microsoft.com → 앱 등록 → 새 등록<br>
        2. 리디렉션 URI: <b>https://localhost:3443/auth/callback</b> (웹)<br>
        3. API 권한 → Microsoft Graph → Mail.Read (위임됨) 추가<br>
        4. 인증서 및 암호 → 새 클라이언트 암호 추가<br>
        5. 위 값들을 여기에 입력 후 저장
      </div>
    `;
  } catch(e) {
    el.innerHTML = '<div class="import-result error">설정 로드 실패</div>';
  }
}

async function saveGraphConfig() {
  const clientId = document.getElementById('graphClientId').value.trim();
  const tenantId = document.getElementById('graphTenantId').value.trim();
  const clientSecret = document.getElementById('graphClientSecret').value.trim();
  const el = document.getElementById('settingsResult');
  if (!clientId || !tenantId) { el.innerHTML = '<div class="import-result error">Client ID와 Tenant ID는 필수입니다</div>'; return; }
  const body = { clientId, tenantId };
  if (clientSecret) body.clientSecret = clientSecret;
  else {
    const existing = await fetch('/api/graph/config', { headers: { 'Authorization': 'Bearer ' + authToken } }).then(r => r.json());
    if (existing.clientSecret !== '••••••') { el.innerHTML = '<div class="import-result error">Client Secret을 입력해주세요</div>'; return; }
    body.clientSecret = '__keep__';
  }
  try {
    const res = await fetch('/api/graph/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    el.innerHTML = '<div class="import-result ' + (res.ok ? 'success' : 'error') + '">' + (data.message || data.error) + '</div>';
  } catch(e) { el.innerHTML = '<div class="import-result error">저장 실패</div>'; }
}

async function submitShipSchedule() {
  const text = document.getElementById('shipScheduleText').value.trim();
  if (!text) return;
  const resultEl = document.getElementById('shipScheduleResult');
  resultEl.innerHTML = '<div class="timeline-empty">처리 중...</div>';
  try {
    const res = await fetch('/api/import-shipping-schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (!res.ok) { resultEl.innerHTML = '<div class="import-result error">' + (data.error || '오류') + '</div>'; return; }
    let html = '';
    if (data.matched.length > 0) {
      html += '<div class="import-result success" style="margin-bottom:12px;">✓ ' + data.matched.length + '건 출하 예정일 설정 완료</div>';
      html += '<div style="max-height:180px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;">';
      html += '<table style="width:100%;font-size:12px;border-collapse:collapse;color:#e2e8f0;">';
      html += '<tr style="border-bottom:1px solid #334155;"><th style="text-align:left;padding:4px 6px;">슬롯</th><th style="text-align:left;padding:4px 6px;">장비</th><th style="text-align:left;padding:4px 6px;">출하일</th><th style="text-align:left;padding:4px 6px;">매칭</th></tr>';
      for (const m of data.matched) {
        html += '<tr style="border-bottom:1px solid #1e293b;"><td style="padding:4px 6px;">' + m.slot + '</td><td style="padding:4px 6px;">' + (m.equipName||'') + '</td><td style="padding:4px 6px;">' + m.shipDate + '</td><td style="padding:4px 6px;color:#3b82f6;">' + m.matchMethod + '</td></tr>';
      }
      html += '</table></div>';
    }
    if (data.unmatched.length > 0) {
      html += '<div class="import-result error" style="margin-bottom:12px;">⚠ ' + data.unmatched.length + '건 미매칭 (입고되지 않은 장비)</div>';
      html += '<div style="max-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;">';
      html += '<table style="width:100%;font-size:11px;border-collapse:collapse;color:#94a3b8;">';
      html += '<tr style="border-bottom:1px solid #334155;"><th style="text-align:left;padding:3px 6px;">Tracking#</th><th style="text-align:left;padding:3px 6px;">모델</th><th style="text-align:left;padding:3px 6px;">라인</th><th style="text-align:left;padding:3px 6px;">출하일</th></tr>';
      for (const u of data.unmatched) {
        html += '<tr style="border-bottom:1px solid #1e293b;"><td style="padding:3px 6px;">' + u.trackingNo + '</td><td style="padding:3px 6px;">' + u.modelName + '</td><td style="padding:3px 6px;">' + u.lineNo + '</td><td style="padding:3px 6px;">' + u.shipDate + '</td></tr>';
      }
      html += '</table></div>';
    }
    if (data.matched.length === 0 && data.unmatched.length === 0) {
      html = '<div class="import-result error">파싱 가능한 데이터가 없습니다. 표 전체를 복사했는지 확인해주세요.</div>';
    }
    resultEl.innerHTML = html;
  } catch(e) {
    resultEl.innerHTML = '<div class="import-result error">오류: ' + e.message + '</div>';
  }
}

function goToSlot(eqId) {
  const eq = allEquipment[eqId];
  if (!eq) return;
  closeModal();
  switchTab(eq.line);
  setTimeout(() => openModal(eqId), 300);
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

setInterval(() => { render(); }, 30000);

</script>
